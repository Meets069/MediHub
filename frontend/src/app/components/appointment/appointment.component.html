<div class="container mt-4">
  <h2 class="text-center">Book Appointment</h2>

  <form (ngSubmit)="openSlotSelection()">
    <!-- Select Doctor -->
    <div class="mb-3">
      <label class="form-label">Select Doctor:</label>
      <select class="form-control" (change)="selectDoctorFromEvent($event)">
        <option value="" disabled selected>Select a doctor</option>
        <option *ngFor="let doctor of doctorList">{{ doctor.name }} - {{ doctor.specialization }}</option>
      </select>
    </div>

    <!-- Doctor Name & Specialization (Readonly) -->
    <div class="mb-3">
      <label class="form-label">Doctor Name:</label>
      <input type="text" class="form-control" [(ngModel)]="newAppointment.doctorName" name="doctorName" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">Specialization:</label>
      <input type="text" class="form-control" [(ngModel)]="newAppointment.specialization" name="specialization" readonly>
    </div>

    <!-- Patient Details -->
    <div class="mb-3">
      <label class="form-label">Patient Name:</label>
      <input type="text" class="form-control" [(ngModel)]="newAppointment.name" name="name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email:</label>
      <input type="email" class="form-control" [(ngModel)]="newAppointment.email" name="email" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description:</label>
      <textarea class="form-control" [(ngModel)]="newAppointment.description" name="description"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Next</button>
  </form>
</div>

<!-- Date & Time Slot Selection Modal -->
<div class="modal" [ngClass]="{'show': showSlotSelection}" style="display: block;" *ngIf="showSlotSelection">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Select Date & Time</h5>
        <button type="button" class="btn-close" (click)="closeSlotSelection()"></button>
      </div>
      <div class="modal-body">
        <label>Select Date:</label>
        <input type="date" class="form-control" [(ngModel)]="selectedDate" name="selectedDate" required>

        <label class="mt-3">Select Time Slot:</label>
        <div class="d-flex flex-wrap">
          <button *ngFor="let slot of availableSlots" class="btn btn-outline-primary m-1"
            [class.active]="selectedTime === slot"
            (click)="selectTimeSlot(slot)">
            {{ slot }}
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeSlotSelection()">Cancel</button>
        <button class="btn btn-primary" (click)="confirmAppointment()">Confirm</button>
      </div>
    </div>
  </div>
</div>
