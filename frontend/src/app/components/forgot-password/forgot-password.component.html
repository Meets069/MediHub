<div class="forgot-password-container">
    <h2 *ngIf="step === 1">Forgot Password</h2>
    <h2 *ngIf="step === 2">Verify OTP</h2>
    <h2 *ngIf="step === 3">Reset Password</h2>
  
    <!-- Step 1: Enter Email -->
    <form *ngIf="step === 1" (ngSubmit)="sendOtp()">
      <label>Email:</label>
      <input type="email" [(ngModel)]="email" name="email" required />
      <button type="submit">Send OTP</button>
    </form>
  
    <!-- Step 2: Enter OTP -->
    <form *ngIf="step === 2" (ngSubmit)="validateOtp()">
      <label>OTP:</label>
      <input type="text" [(ngModel)]="otp" name="otp" required />
      <button type="submit">Verify OTP</button>
    </form>
  
    <!-- Step 3: Reset Password -->
    <form *ngIf="step === 3" (ngSubmit)="resetPassword()">
      <label>New Password:</label>
      <input type="password" [(ngModel)]="password" name="password" required />
      <button type="submit">Reset Password</button>
    </form>
  </div>
