  <table class="appointment-table">
    <thead>
      <tr>
        <th>Doctor Name</th>
        <th>Specialization</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let appointment of appointments">
        <td>{{ appointment.doctorName }}</td>
        <td>{{ appointment.specialization }}</td>
        <td>{{ appointment.date }}</td>
        <td>{{ appointment.time }}</td>
        <td>{{ appointment.status }}</td>
        
        <td>
          <button class="edit-btn" (click)="openEditDialog(appointment)">Edit</button>
          <button class="delete-btn" (click)="deleteAppointment(appointment._id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  
  
  <ng-template #editDialog>
    <div class="edit-dialog-container">
      <h2 class="dialog-title">Edit Appointment</h2>
      <form [formGroup]="appointmentForm" class="appointment-form">
        <div class="form-row">
          <label for="doctorName">Doctor Name:</label>
          <mat-form-field appearance="outline" class="input-field">
            <input matInput id="doctorName" formControlName="doctorName">
          </mat-form-field>
        </div>
  
        <div class="form-row">
          <label for="specialization">Specialization:</label>
          <mat-form-field appearance="outline" class="input-field">
            <input matInput id="specialization" formControlName="specialization">
          </mat-form-field>
        </div>
  
        <div class="form-row">
          <label for="date">Date:</label>
          <mat-form-field appearance="outline" class="input-field">
            <input matInput id="date" type="date" formControlName="date">
          </mat-form-field>
        </div>
  
        <div class="form-row">
          <label for="time">Time:</label>
          <mat-form-field appearance="outline" class="input-field">
            <input matInput id="time" type="time" formControlName="time">
          </mat-form-field>
        </div>
        <!-- <div class="form-row">

        <div class="actions">
          <button mat-button (click)="dialog.closeAll()">Cancel</button>
          <button mat-raised-button color="primary" (click)="dialog.closeAll(); saveChanges()">Save</button>
        </div>
      </form>
    </div>
  </ng-template>
